[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py2rust"
version = "0.1.0"
description = "A Python to Rust subset compiler"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
py2rust = "py2rust.cli:main"

[tool.pytest.ini_options]
testpaths = ["py2rust/tests"]
